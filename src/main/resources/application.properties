spring.application.name=citizentech
server.port=${PORT:8080}
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Credenciais locais (opcional): se existir o arquivo local.env.properties na raiz do projeto, ele e lido.
# No Render este arquivo nao existe e valem as variaveis de ambiente DB_URL, DB_USER e DB_PASSWORD.
spring.config.import=optional:file:./local.env.properties
